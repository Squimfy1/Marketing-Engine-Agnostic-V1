[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "marketing-engine"
version = "0.1.0"
description = "Agnostic, multi-tenant AI marketing-content engine with Obsidian integration"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "claude-agent-sdk>=0.1.0",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
engine = "marketing_engine.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/marketing_engine"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
